name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'references/**'
      - '.github/workflows/pr-validation.yaml'
      - '.github/commitlint.config.cjs'
  workflow_dispatch:

jobs:
  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.cjs

  release:
    name: Semantic Release
    needs: conventional-commits
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill format
        run: |
          TMP_DIR="$(mktemp -d)"
          cp -R "$GITHUB_WORKSPACE" "$TMP_DIR/raindrop-io"
          npx --yes --registry=https://registry.npmjs.org skills-ref validate "$TMP_DIR/raindrop-io"

      - name: Prepare semantic-release config
        run: cp .github/release.config.cjs ./release.config.cjs

      - name: Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
